
name: Update Profile README

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-update
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update repository list and timestamp
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const username = 'karthikm-ux';
            const file = 'README.md';

            let readme = fs.readFileSync(file, 'utf8');

            const start = '<!-- AUTO-UPDATE:START -->';
            const end = '<!-- AUTO-UPDATE:END -->';

            if (!readme.includes(start) || !readme.includes(end)) {
              core.setFailed('README auto-update markers are missing.');
              return;
            }

            const { data: repos } =
              await github.rest.repos.listForUser({
                username,
                sort: 'updated',
                direction: 'desc',
                per_page: 100
              });

            const recent = repos
              .filter(r => !r.fork && !r.archived && !r.private)
              .sort((a, b) =>
                new Date(b.pushed_at || 0) -
                new Date(a.pushed_at || 0)
              )
              .slice(0, 5);

            const section = recent.length
              ? recent.map(r => {
                  const description = r.description
                    ? ` — ${r.description.replace(/\r?\n/g, ' ')}`
                    : '';
                  const date = r.pushed_at
                    ? ` · Updated ${r.pushed_at.slice(0, 10)}`
                    : '';
                  return `- [${r.name}](${r.html_url})${description}${date}`;
                }).join('\n')
              : '*No public repositories found yet.*';

            const before = readme.split(start)[0] + start + '\n';
            const after = readme.split(end).slice(1).join(end);

            readme = before + section + '\n' + end + after;

            const timestamp = new Date().toISOString().slice(0, 10);
            const timestampPattern =
              /<!-- LAST-UPDATED -->[\s\S]*?<!-- \/LAST-UPDATED -->/;

            if (timestampPattern.test(readme)) {
              readme = readme.replace(
                timestampPattern,
                `<!-- LAST-UPDATED -->${timestamp}<!-- /LAST-UPDATED -->`
              );
            }

            fs.writeFileSync(file, readme);

      - name: Commit README changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile README"
          file_pattern: README.md
